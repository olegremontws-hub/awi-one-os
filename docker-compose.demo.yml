name: awi-one-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: awi_one
      POSTGRES_USER: awi
      POSTGRES_PASSWORD: awi_demo_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awi -d awi_one"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - awi_demo_postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://awi:awi_demo_only@postgres:5432/awi_one
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: postgres:16-alpine
    command: ["psql", "postgres://awi:awi_demo_only@postgres:5432/awi_one", "-v", "ON_ERROR_STOP=1", "-f", "/demo/seed.sql"]
    volumes:
      - ./demo/seed.sql:/demo/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    init: true
    environment:
      NODE_ENV: ci
      DATABASE_URL: postgres://awi:awi_demo_only@postgres:5432/awi_one
      AWI_MODEL_PROVIDER: deterministic-test
      AWI_ALLOW_TEST_PROVIDER: "true"
      AWI_OBJECT_ROOT: /app/.awi-demo-objects
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./demo/objects:/app/.awi-demo-objects
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  awi_demo_postgres:
